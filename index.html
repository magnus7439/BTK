<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTK - Multi-Track Percussão</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --subtext-color: #b0b0b0;
            --error-color: #f44336;
            --success-color: #4caf50;
            --btn-off: #424242;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .header h2 { margin: 0; font-size: 1.3rem; }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
            background: #333;
            color: var(--subtext-color);
        }

        .status-badge.online { background: rgba(76, 175, 80, 0.2); color: var(--success-color); }
        .status-badge.offline { background: rgba(244, 67, 54, 0.2); color: var(--error-color); }

        select {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            background: #2a2a2a;
            color: var(--text-color);
            border: 2px solid #444;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
        }

        select:focus { border-color: var(--accent-color); }

        .timer-box {
            text-align: center;
            background: #181818;
            padding: 16px;
            border-radius: 12px;
        }

        .timer-label { font-size: 0.85rem; color: var(--subtext-color); margin-bottom: 4px; }
        .timer-display { font-size: 2.5rem; font-weight: bold; font-family: monospace; color: var(--accent-color); }

        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .player-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:active:not(:disabled) { opacity: 0.8; }

        .btn-play { background: var(--accent-color); color: #000; }
        .btn-stop { background: #333; color: var(--text-color); }

        /* Container de Faixas / Stems */
        .stems-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #181818;
            padding: 12px;
            border-radius: 12px;
        }

        .stem-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .stem-title {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-toggle {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 6px;
            min-width: 70px;
        }

        .btn-toggle.on {
            background: var(--success-color);
            color: #fff;
        }

        .btn-toggle.off {
            background: var(--btn-off);
            color: var(--subtext-color);
        }

        .toast {
            font-size: 0.85rem;
            text-align: center;
            color: var(--subtext-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎛️ BTK - Percussão</h2>
        <span id="status" class="status-badge">Detectando...</span>
    </div>

    <div>
        <select id="trackSelect" disabled>
            <option>Carregando lista...</option>
        </select>
    </div>

    <div class="timer-box">
        <div class="timer-label">⏱️ TEMPO DECORRIDO (LOOP)</div>
        <div id="timerDisplay" class="timer-display">00:00.0</div>
    </div>

    <div class="speed-control">
        <div class="speed-header">
            <span>⏱️ VELOCIDADE (BPM)</span>
            <span id="speedDisplay">100%</span>
        </div>
        <input type="range" id="speedSlider" min="50" max="150" value="100" step="5">
    </div>

    <div class="player-controls">
        <button id="btnPlay" class="btn-play" disabled>PLAY</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
    </div>

    <!-- Lista dinâmica de canais/faixas com ON/OFF -->
    <div id="stemsContainer" class="stems-container">
        <div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">
            Selecione uma música para carregar os canais.
        </div>
    </div>

    <div id="toastMessage" class="toast">Conectando à planilha...</div>
</div>

<script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCc-DraIfiV5aNPT81agJjZrFE8BSR0ocAcMbHRxSwEvJMBxlVXr4Vz6DBjxtzotG_M6amT7Myu79_/pub?output=csv';

    const trackSelect = document.getElementById('trackSelect');
    const timerDisplay = document.getElementById('timerDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const stemsContainer = document.getElementById('stemsContainer');
    const statusBadge = document.getElementById('status');
    const toastMessage = document.getElementById('toastMessage');

    let songsData = [];
    let audioElements = [];
    let isPlaying = false;
    let timerInterval = null;

    // Garante que o link do Dropbox toque diretamente
    function fixDropboxUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('dropbox.com')) {
            if (url.includes('dl=0')) return url.replace('dl=0', 'raw=1');
            if (!url.includes('raw=1') && !url.includes('dl=1')) {
                return url + (url.includes('?') ? '&' : '?') + 'raw=1';
            }
        }
        return url;
    }

    async function init() {
        await loadSongs();
    }

    async function loadSongs() {
        try {
            updateStatus('Buscando...', 'offline');
            const response = await fetch(GOOGLE_SHEET_CSV_URL);
            if (!response.ok) throw new Error('Falha na rede');
            
            const csvText = await response.text();
            songsData = parseCSV(csvText);

            localStorage.setItem('btk_songs_cache', JSON.stringify(songsData));
            updateStatus('Online', 'online');
            toastMessage.textContent = 'Músicas e canais atualizados!';
            populateSelect(songsData);
        } catch (error) {
            console.warn('Usando dados offline em cache...', error);
            const cached = localStorage.getItem('btk_songs_cache');
            if (cached) {
                songsData = JSON.parse(cached);
                updateStatus('Modo Offline', 'offline');
                toastMessage.textContent = 'Modo offline: Carregado do cache.';
                populateSelect(songsData);
            } else {
                updateStatus('Erro', 'offline');
                toastMessage.textContent = 'Erro ao carregar dados da planilha.';
            }
        }
    }

    // Leitor de CSV que pega Coluna A (Nome) e Colunas B, C, D... (Audio URLs)
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const parsed = [];

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            let parts = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    parts.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            parts.push(current);

            if (parts.length >= 2) {
                const songName = parts[0].replace(/"/g, '').trim();
                if (!songName || songName.toLowerCase() === 'nome' || songName.toLowerCase() === 'musica') continue;

                // Coleta todas as colunas de áudio a partir da Coluna B (índice 1)
                const urls = parts.slice(1)
                    .map(u => fixDropboxUrl(u.replace(/"/g, '')))
                    .filter(u => u.startsWith('http'));

                if (urls.length > 0) {
                    parsed.push({ name: songName, urls: urls });
                }
            }
        }
        return parsed;
    }

    function populateSelect(list) {
        trackSelect.innerHTML = '<option value="">-- Selecione uma música --</option>';
        list.forEach((song, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${song.name} (${song.urls.length} faixas)`;
            trackSelect.appendChild(opt);
        });
        trackSelect.disabled = false;
    }

    // Quando uma música é selecionada, carrega todos os canais de áudio simultaneamente
    trackSelect.addEventListener('change', (e) => {
        stopAll();
        const index = e.target.value;

        if (index === '') {
            btnPlay.disabled = true;
            btnStop.disabled = true;
            stemsContainer.innerHTML = '<div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">Selecione uma música para carregar os canais.</div>';
            return;
        }

        const selectedSong = songsData[index];
        audioElements = [];
        stemsContainer.innerHTML = '';

        selectedSong.urls.forEach((url, i) => {
            const audio = new Audio(url);
            audio.loop = true; // REPETIÇÃO INFINITA (LOOP)
            audio.preload = 'auto';
            audio.preservesPitch = true;
            audio.playbackRate = speedSlider.value / 100;

            audioElements.push(audio);

            // Cria o controle visual (ON/OFF) para a faixa
            const row = document.createElement('div');
            row.className = 'stem-row';

            const title = document.createElement('span');
            title.className = 'stem-title';
            title.textContent = `Faixa ${i + 1}`;

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn-toggle on';
            toggleBtn.textContent = 'ON';

            toggleBtn.addEventListener('click', () => {
                audio.muted = !audio.muted;
                if (audio.muted) {
                    toggleBtn.textContent = 'OFF';
                    toggleBtn.className = 'btn-toggle off';
                } else {
                    toggleBtn.textContent = 'ON';
                    toggleBtn.className = 'btn-toggle on';
                }
            });

            row.appendChild(title);
            row.appendChild(toggleBtn);
            stemsContainer.appendChild(row);
        });

        btnPlay.disabled = false;
        btnStop.disabled = false;
        toastMessage.textContent = `Música carregada: ${selectedSong.name}`;
    });

    // Controle de Velocidade (Aplica a todos os canais em execução)
    speedSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        speedDisplay.textContent = `${val}%`;
        audioElements.forEach(audio => {
            audio.playbackRate = val / 100;
            audio.preservesPitch = true;
        });
    });

    // PLAY / PAUSE Global (Sincronizado)
    btnPlay.addEventListener('click', () => {
        if (!isPlaying) {
            // Sincroniza e roda todas as faixas
            Promise.all(audioElements.map(a => a.play())).then(() => {
                isPlaying = true;
                btnPlay.textContent = 'PAUSE';
                startTimer();
            }).catch(err => {
                console.error(err);
                toastMessage.textContent = 'Erro ao iniciar áudios. Verifique a conexão/links.';
            });
        } else {
            audioElements.forEach(a => a.pause());
            isPlaying = false;
            btnPlay.textContent = 'PLAY';
            stopTimer();
        }
    });

    // STOP Global (Reseta todas para o início)
    btnStop.addEventListener('click', () => {
        stopAll();
    });

    function stopAll() {
        audioElements.forEach(a => {
            a.pause();
            a.currentTime = 0;
        });
        isPlaying = false;
        btnPlay.textContent = 'PLAY';
        stopTimer();
        timerDisplay.textContent = '00:00.0';
    }

    function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            if (audioElements.length > 0 && isPlaying) {
                const current = audioElements[0].currentTime;
                const mins = Math.floor(current / 60).toString().padStart(2, '0');
                const secs = Math.floor(current % 60).toString().padStart(2, '0');
                const ms = Math.floor((current % 1) * 10);
                timerDisplay.textContent = `${mins}:${secs}.${ms}`;
            }
        }, 100);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
    }

    function updateStatus(text, type) {
        statusBadge.textContent = text;
        statusBadge.className = `status-badge ${type}`;
    }

    init();
</script>
</body>
</html>
