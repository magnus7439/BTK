<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTK - Percussão</title>
    <!-- Biblioteca SoundTouchJS para Time-Stretching sem alterar o Pitch -->
    <script src="https://cdn.jsdelivr.net/npm/soundtouchjs@0.1.30/dist/soundtouch.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212; color: #ffffff; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .multitrack-container {
            background: #1e1e1e; padding: 24px; border-radius: 16px;
            width: 100%; max-width: 720px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        h2 { font-size: 1.4em; margin-bottom: 15px; }
        
        .select-box {
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;
        }
        .select-box label { font-size: 0.85em; color: #aaa; font-weight: bold; text-transform: uppercase; }
        select {
            padding: 12px; border-radius: 8px; background: #2a2a2a; color: #fff;
            border: 1px solid rgba(255,255,255,0.2); font-size: 1em; cursor: pointer;
        }

        .bpm-container {
            background: rgba(0, 188, 212, 0.05); padding: 14px; border-radius: 8px;
            border: 1px solid rgba(0, 188, 212, 0.2); margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .bpm-header {
            display: flex; justify-content: space-between; font-size: 0.9em; font-weight: bold; color: #00bcd4;
        }

        .master-controls {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.04); padding: 16px; border-radius: 12px;
            margin-bottom: 20px; gap: 12px;
        }
        .master-buttons { display: flex; gap: 10px; }
        .btn-master {
            padding: 12px 24px; border: none; border-radius: 30px; font-weight: bold;
            cursor: pointer; font-size: 0.9em; text-transform: uppercase;
        }
        .btn-play { background: #28a745; color: #ffffff; }
        .btn-play:disabled { background: #444444; color: #888888; cursor: not-allowed; }
        .btn-stop { background: #dc3545; color: #ffffff; }
        .btn-cache {
            background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.8em;
        }

        .status-box {
            font-size: 0.85em; color: #00bcd4; margin-bottom: 20px; padding: 10px;
            background: rgba(0, 188, 212, 0.1); border-radius: 6px; border-left: 4px solid #00bcd4;
        }

        .track-list { display: flex; flex-direction: column; gap: 12px; }
        .track-row {
            display: grid; grid-template-columns: 140px 100px 1fr; align-items: center;
            gap: 14px; background: rgba(255, 255, 255, 0.03); padding: 12px 16px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .track-name { font-weight: 600; font-size: 0.9em; color: #ffeb3b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-mute {
            padding: 8px 12px; border: 1px solid #28a745; background: rgba(40, 167, 69, 0.15);
            color: #28a745; border-radius: 20px; cursor: pointer; font-size: 0.75em; font-weight: bold;
        }
        .btn-mute.is-muted { background: rgba(220, 53, 69, 0.85); border-color: #dc3545; color: #ffffff; }
        input[type=range] { width: 100%; accent-color: #00bcd4; cursor: pointer; }
    </style>
</head>
<body>

    <div class="multitrack-container">
        <h2>🎛️ BTK - Percussão (conectar com o Google)</h2>

        <div class="select-box">
            <label for="song-select">SELECIONAR RITMO:</label>
            <select id="song-select" onchange="trocarMusica(this.value)">
                <option value="">Carregando opções...</option>
            </select>
        </div>

        <div class="bpm-container">
            <div class="bpm-header">
                <span>⏱️ VELOCIDADE / TEMPO (Tom Preservado)</span>
                <span id="bpm-val">100%</span>
            </div>
            <input type="range" id="bpm-range" min="0.5" max="1.5" step="0.02" value="1" oninput="alterarVelocidade(this.value)">
        </div>

        <div class="master-controls">
            <div class="master-buttons">
                <button id="btn-play-master" class="btn-master btn-play" onclick="togglePlay()" disabled>Carregando...</button>
                <button class="btn-master btn-stop" onclick="stopAll()">■ Stop</button>
            </div>
            <button class="btn-cache" onclick="limparCache()">🗑️ Limpar Memória Local</button>
        </div>

        <div class="status-box" id="status-text">Conectando à planilha...</div>

        <div class="track-list" id="track-container"></div>
    </div>

    <script>
        const CACHE_NAME = 'multitrack-sheet-audio-v4';
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRCc-DraIfiV5aNPT81agJjZrFE8BSR0ocAcMbHRxSwEvJMBxlVXr4Vz6DBjxtzotG_M6amT7Myu79_/pub?output=csv";

        let dadosPlanilha = [];
        let nomesCanais = [];
        let audioUrlsAtuais = [];
        let audioCtx;
        let audioBuffers = [];
        let soundtouchNodes = [];
        let gainNodes = [];
        let muteStates = [];
        let currentTempo = 1.0;

        let isPlaying = false;
        let isLoaded = false;

        function normalizarUrl(url) {
            if (!url) return '';
            let link = url.trim();
            if (link.includes('dropbox.com')) {
                return link.replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                           .replace('?dl=0', '').replace('&dl=0', '');
            } else if (link.includes('drive.google.com') && link.includes('/d/')) {
                const id = link.split('/d/')[1].split('/')[0];
                return `https://drive.google.com/uc?export=download&id=${id}`;
            }
            return link;
        }

        function parseCSVLine(text) {
            const result = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { inQuotes = !inQuotes; }
                else if (c === ',' && !inQuotes) {
                    result.push(cell.trim());
                    cell = '';
                } else { cell += c; }
            }
            result.push(cell.trim());
            return result;
        }

        async function carregarPlanilha() {
            const statusText = document.getElementById('status-text');
            try {
                const res = await fetch(SHEET_CSV_URL);
                if (!res.ok) throw new Error("Não foi possível carregar a planilha.");
                
                const csvText = await res.text();
                const linhas = csvText.split('\n').filter(l => l.trim() !== '');

                if (linhas.length < 2) {
                    throw new Error("A planilha precisa ter um cabeçalho e pelo menos 1 linha de dados.");
                }

                const cabecalho = parseCSVLine(linhas[0]);
                nomesCanais = cabecalho.slice(1);

                dadosPlanilha = linhas.slice(1).map(linha => {
                    const colunas = parseCSVLine(linha);
                    return {
                        nomeMusica: colunas[0],
                        urls: colunas.slice(1)
                    };
                }).filter(d => d.nomeMusica && d.urls.length > 0);

                preencherSelect();
                if (dadosPlanilha.length > 0) {
                    trocarMusica(0);
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "⚠️ Erro ao carregar planilha. Verifique se ela está publicada como CSV.";
            }
        }

        function preencherSelect() {
            const select = document.getElementById('song-select');
            select.innerHTML = '';
            dadosPlanilha.forEach((item, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = item.nomeMusica;
                select.appendChild(opt);
            });
        }

        async function trocarMusica(index) {
            stopAll();
            isLoaded = false;
            const btnPlay = document.getElementById('btn-play-master');
            btnPlay.disabled = true;
            btnPlay.innerText = "Carregando...";

            const musicaSelecionada = dadosPlanilha[index];
            audioUrlsAtuais = musicaSelecionada.urls.map((url, i) => ({
                name: nomesCanais[i] || `Pista ${i+1}`,
                url: url
            })).filter(track => track.url && track.url.length > 5);

            muteStates = new Array(audioUrlsAtuais.length).fill(false);
            renderTracks();
            await loadAllTracksWithCache();
        }

        function renderTracks() {
            const container = document.getElementById('track-container');
            container.innerHTML = '';

            audioUrlsAtuais.forEach((track, index) => {
                container.innerHTML += `
                    <div class="track-row">
                        <span class="track-name" title="${track.name}">${track.name}</span>
                        <button class="btn-mute" id="mute-btn-${index}" onclick="toggleTrackMute(${index})">
                            🔊 LIGADO
                        </button>
                        <input type="range" id="vol-${index}" min="0" max="1" step="0.01" value="1" oninput="changeVolume(${index}, this.value)">
                    </div>
                `;
            });
        }

        async function loadAllTracksWithCache() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const statusText = document.getElementById('status-text');

            try {
                const cache = await caches.open(CACHE_NAME);

                const promises = audioUrlsAtuais.map(async (item, index) => {
                    const finalUrl = normalizarUrl(item.url);
                    statusText.innerText = `Verificando cache da pista ${index + 1} de ${audioUrlsAtuais.length}...`;

                    let response = await cache.match(finalUrl);

                    if (!response) {
                        statusText.innerText = `Baixando faixa (${index + 1}/${audioUrlsAtuais.length}): ${item.name}...`;
                        const req = new Request(finalUrl, { mode: 'cors' });
                        response = await fetch(req);
                        
                        if (!response.ok) throw new Error(`Não foi possível baixar a pista: ${item.name}`);
                        await cache.put(req, response.clone());
                    }

                    const arrayBuffer = await response.arrayBuffer();
                    return await audioCtx.decodeAudioData(arrayBuffer);
                });

                audioBuffers = await Promise.all(promises);
                isLoaded = true;

                statusText.innerText = "✅ Pistas sincronizadas e salvas no dispositivo! Pronto para tocar.";
                const btnPlay = document.getElementById('btn-play-master');
                btnPlay.innerText = "▶ PLAY";
                btnPlay.disabled = false;

            } catch (err) {
                console.error("Erro no carregamento:", err);
                statusText.innerText = "⚠️ Erro ao carregar mídias da música selecionada.";
            }
        }

        function togglePlay() {
            if (!isLoaded) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (isPlaying) { pauseAll(); } else { playAll(); }
        }

        function playAll() {
            soundtouchNodes = []; 
            gainNodes = [];

            audioBuffers.forEach((buffer, index) => {
                // Cria a fonte de áudio do SoundTouchJS para Time-Stretching
                const source = new soundtouch.WebAudioBufferSource(buffer);
                const st = new soundtouch.SoundTouch(audioCtx.sampleRate);
                
                // Configura para manter o tom original (Pitch = 1.0) e altera apenas o Tempo
                st.pitch = 1.0;
                st.tempo = currentTempo;

                const filter = new soundtouch.SimpleFilter(source, st);
                
                // Cria o nó de áudio em tempo real com buffer de loop contínuo
                const node = soundtouch.getWebAudioNode(audioCtx, filter);

                const gain = audioCtx.createGain();
                const volSlider = document.getElementById(`vol-${index}`).value;
                gain.gain.value = muteStates[index] ? 0 : volSlider;

                node.connect(gain);
                gain.connect(audioCtx.destination);

                soundtouchNodes.push({ filter: filter, st: st, node: node });
                gainNodes.push(gain);
            });

            isPlaying = true;
            document.getElementById('btn-play-master').innerText = "⏸ PAUSE";
            document.getElementById('status-text').innerText = `🔁 Reproduzindo em Loop (${Math.round(currentTempo * 100)}% BPM - Tom Original)...`;
        }

        function pauseAll() {
            if (!isPlaying) return;
            soundtouchNodes.forEach(item => {
                if (item.node) item.node.disconnect();
            });
            isPlaying = false;
            document.getElementById('btn-play-master').innerText = "▶ PLAY";
            document.getElementById('status-text').innerText = "⏸ Pausado.";
        }

        function stopAll() {
            soundtouchNodes.forEach(item => {
                if (item.node) item.node.disconnect();
            });
            isPlaying = false;
            const btnPlay = document.getElementById('btn-play-master');
            if (btnPlay) btnPlay.innerText = "▶ PLAY";
            const statusText = document.getElementById('status-text');
            if (statusText && isLoaded) statusText.innerText = "⏹ Parado.";
        }

        // ⏱️ Ajusta o tempo sem alterar a afinação/pitch
        function alterarVelocidade(val) {
            currentTempo = parseFloat(val);
            document.getElementById('bpm-val').innerText = `${Math.round(currentTempo * 100)}%`;
            
            soundtouchNodes.forEach(item => {
                if (item.st) {
                    item.st.tempo = currentTempo;
                }
            });

            if (isPlaying) {
                document.getElementById('status-text').innerText = `🔁 Reproduzindo em Loop (${Math.round(currentTempo * 100)}% BPM - Tom Original)...`;
            }
        }

        function changeVolume(index, value) {
            if (gainNodes[index] && !muteStates[index]) { gainNodes[index].gain.value = value; }
        }

        function toggleTrackMute(index) {
            muteStates[index] = !muteStates[index];
            const btn = document.getElementById(`mute-btn-${index}`);
            const sliderVal = document.getElementById(`vol-${index}`).value;

            if (muteStates[index]) {
                btn.classList.add('is-muted'); btn.innerText = "🔇 MUTE";
                if (gainNodes[index]) gainNodes[index].gain.value = 0;
            } else {
                btn.classList.remove('is-muted'); btn.innerText = "🔊 LIGADO";
                if (gainNodes[index]) gainNodes[index].gain.value = sliderVal;
            }
        }

        async function limparCache() {
            if (confirm("Deseja apagar os áudios salvos na memória local do navegador?")) {
                await caches.delete(CACHE_NAME);
                alert("Memória limpa com sucesso!");
                location.reload();
            }
        }

        window.addEventListener('load', () => {
            carregarPlanilha();
        });
    </script>
</body>
</html>
