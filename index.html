<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTK - Percussão</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --subtext-color: #b0b0b0;
            --error-color: #f44336;
            --success-color: #4caf50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .header h2 { margin: 0; font-size: 1.3rem; }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
            background: #333;
            color: var(--subtext-color);
        }

        .status-badge.online { background: rgba(76, 175, 80, 0.2); color: var(--success-color); }
        .status-badge.offline { background: rgba(244, 67, 54, 0.2); color: var(--error-color); }

        select {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            background: #2a2a2a;
            color: var(--text-color);
            border: 2px solid #444;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
        }

        select:focus { border-color: var(--accent-color); }

        .timer-box {
            text-align: center;
            background: #181818;
            padding: 16px;
            border-radius: 12px;
        }

        .timer-label { font-size: 0.85rem; color: var(--subtext-color); margin-bottom: 4px; }
        .timer-display { font-size: 2.5rem; font-weight: bold; font-family: monospace; color: var(--accent-color); }

        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .player-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:active:not(:disabled) { opacity: 0.8; }

        .btn-play { background: var(--accent-color); color: #000; }
        .btn-stop { background: #333; color: var(--text-color); }

        .toast {
            font-size: 0.85rem;
            text-align: center;
            color: var(--subtext-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎛️ BTK - Percussão 5</h2>
        <span id="status" class="status-badge">Detectando...</span>
    </div>

    <div>
        <select id="trackSelect" disabled>
            <option>Carregando lista...</option>
        </select>
    </div>

    <div class="timer-box">
        <div class="timer-label">⏱️ TEMPO DECORRIDO</div>
        <div id="timerDisplay" class="timer-display">00:00.0</div>
    </div>

    <div class="speed-control">
        <div class="speed-header">
            <span>⏱️ VELOCIDADE (BPM)</span>
            <span id="speedDisplay">100%</span>
        </div>
        <input type="range" id="speedSlider" min="50" max="150" value="100" step="5">
    </div>

    <div class="player-controls">
        <button id="btnPlay" class="btn-play" disabled>PLAY</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
    </div>

    <div id="toastMessage" class="toast">Conectando à planilha...</div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
    // URL convertida para puxar o CSV da planilha do Google
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCc-DraIfiV5aNPT81agJjZrFE8BSR0ocAcMbHRxSwEvJMBxlVXr4Vz6DBjxtzotG_M6amT7Myu79_/pub?output=csv';

    const trackSelect = document.getElementById('trackSelect');
    const timerDisplay = document.getElementById('timerDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const statusBadge = document.getElementById('status');
    const toastMessage = document.getElementById('toastMessage');
    const audio = document.getElementById('audioPlayer');

    let tracks = [];

    // Trava de afinação: impede que a música fique aguda/grave ao mudar a velocidade
    function applyPitchPreservation() {
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
        audio.mozPreservesPitch = true;
    }

    async function init() {
        applyPitchPreservation();
        await loadTracks();
    }

    async function loadTracks() {
        try {
            updateStatus('Buscando...', 'offline');
            const response = await fetch(GOOGLE_SHEET_CSV_URL);
            
            if (!response.ok) throw new Error('Falha de rede');
            
            const csvText = await response.text();
            tracks = parseCSV(csvText);

            // Armazenar no navegador caso falte internet no próximo ensaio
            localStorage.setItem('btk_tracks_cache', JSON.stringify(tracks));
            
            updateStatus('Online', 'online');
            toastMessage.textContent = 'Lista atualizada com sucesso!';
            populateSelect(tracks);
        } catch (error) {
            console.warn('Erro ao conectar à planilha. Carregando dados locais...', error);
            
            const cachedTracks = localStorage.getItem('btk_tracks_cache');
            if (cachedTracks) {
                tracks = JSON.parse(cachedTracks);
                updateStatus('Modo Offline', 'offline');
                toastMessage.textContent = 'Sem conexão. Usando músicas salvas em cache.';
                populateSelect(tracks);
            } else {
                updateStatus('Erro', 'offline');
                toastMessage.textContent = 'Não foi possível carregar as faixas (sem conexão e sem cache).';
            }
        }
    }

    // Leitor de CSV ROBUSTO: Ignora vírgulas dentro do nome da música
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const parsed = [];
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            let parts = [];
            let currentPart = '';
            let insideQuotes = false;
            
            // Lógica que lê caractere por caractere (perfeita para planilhas)
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === ',' && !insideQuotes) {
                    parts.push(currentPart);
                    currentPart = '';
                } else {
                    currentPart += char;
                }
            }
            parts.push(currentPart);
            
            if (parts.length >= 2) {
                const name = parts[0].trim();
                let url = parts[1].trim();
                
                // Pular o cabeçalho
                if (name.toLowerCase() === 'nome' || url.toLowerCase() === 'link') continue;
                
                // Otimização para LINKS DO DROPBOX tocarem direto sem bloquear
                if (url.includes('dropbox.com')) {
                    if (url.includes('dl=0')) {
                        url = url.replace('dl=0', 'raw=1');
                    } else if (!url.includes('raw=1') && !url.includes('dl=1')) {
                        url += (url.includes('?') ? '&' : '?') + 'raw=1';
                    }
                }
                
                if (name && url) {
                    parsed.push({ name, url });
                }
            }
        }
        return parsed;
    }

    function populateSelect(trackList) {
        trackSelect.innerHTML = '<option value="">-- Selecione uma música --</option>';
        trackList.forEach((t, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = t.name;
            trackSelect.appendChild(opt);
        });
        trackSelect.disabled = false;
    }

    trackSelect.addEventListener('change', (e) => {
        const index = e.target.value;
        if (index !== '') {
            audio.src = tracks[index].url;
            btnPlay.disabled = false;
            btnStop.disabled = false;
            toastMessage.textContent = `Carregado: ${tracks[index].name}`;
        } else {
            btnPlay.disabled = true;
            btnStop.disabled = true;
        }
    });

    speedSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        speedDisplay.textContent = `${val}%`;
        audio.playbackRate = val / 100;
        applyPitchPreservation();
    });

    btnPlay.addEventListener('click', () => {
        if (audio.paused) {
            audio.play().then(() => {
                btnPlay.textContent = 'PAUSE';
            }).catch((err) => {
                console.error(err);
                toastMessage.textContent = 'Erro ao tocar. Verifique o link do Dropbox.';
            });
        } else {
            audio.pause();
            btnPlay.textContent = 'PLAY';
        }
    });

    btnStop.addEventListener('click', () => {
        audio.pause();
        audio.currentTime = 0;
        btnPlay.textContent = 'PLAY';
    });

    audio.addEventListener('timeupdate', () => {
        const current = audio.currentTime;
        const mins = Math.floor(current / 60).toString().padStart(2, '0');
        const secs = Math.floor(current % 60).toString().padStart(2, '0');
        const ms = Math.floor((current % 1) * 10);
        timerDisplay.textContent = `${mins}:${secs}.${ms}`;
    });

    audio.addEventListener('ended', () => {
        btnPlay.textContent = 'PLAY';
        audio.currentTime = 0;
    });

    audio.addEventListener('error', () => {
        toastMessage.textContent = 'Erro no áudio. O link pode ter mudado ou expirado.';
        btnPlay.textContent = 'PLAY';
    });

    function updateStatus(text, type) {
        statusBadge.textContent = text;
        statusBadge.className = `status-badge ${type}`;
    }

    // Inicia a aplicação
    init();
</script>
</body>
</html>
