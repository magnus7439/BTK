<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTK - Multi-Track Studio</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --text-color: #ffffff;
            --subtext-color: #b0b0b0;
            --error-color: #f44336;
            --success-color: #4caf50;
            --btn-off: #424242;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .header h2 { margin: 0; font-size: 1.3rem; }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
            background: #333;
            color: var(--subtext-color);
        }

        .status-badge.online { background: rgba(76, 175, 80, 0.2); color: var(--success-color); }
        .status-badge.offline { background: rgba(244, 67, 54, 0.2); color: var(--error-color); }

        select {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            background: #2a2a2a;
            color: var(--text-color);
            border: 2px solid #444;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
        }

        select:focus { border-color: var(--accent-color); }

        .timer-box {
            text-align: center;
            background: #181818;
            padding: 14px;
            border-radius: 12px;
        }

        .timer-label { font-size: 0.8rem; color: var(--subtext-color); margin-bottom: 4px; }
        .timer-display { font-size: 2.5rem; font-weight: bold; font-family: monospace; color: var(--accent-color); }

        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .player-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        button {
            padding: 16px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:active:not(:disabled) { opacity: 0.8; }

        .btn-play { background: var(--accent-color); color: #000; }
        .btn-stop { background: #333; color: var(--text-color); }
        .btn-clear-cache {
            background: transparent;
            color: var(--subtext-color);
            border: 1px solid #444;
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            margin-top: 5px;
        }

        .stems-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #181818;
            padding: 12px;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
        }

        .stem-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .stem-title { font-size: 0.9rem; font-weight: bold; }

        .btn-toggle {
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 6px;
            min-width: 70px;
        }

        .btn-toggle.on { background: var(--success-color); color: #fff; }
        .btn-toggle.off { background: var(--btn-off); color: var(--subtext-color); }

        .toast {
            font-size: 0.85rem;
            text-align: center;
            color: var(--subtext-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🎛️ BTK - Percussão</h2>
        <span id="status" class="status-badge">Detectando...</span>
    </div>

    <div>
        <select id="trackSelect" disabled>
            <option>Carregando lista...</option>
        </select>
    </div>

    <div class="timer-box">
        <div class="timer-label">⏱️ TEMPO DECORRIDO (LOOP)</div>
        <div id="timerDisplay" class="timer-display">00:00.0</div>
    </div>

    <div class="speed-control">
        <div class="speed-header">
            <span>⏱️ VELOCIDADE (BPM)</span>
            <span id="speedDisplay">100%</span>
        </div>
        <input type="range" id="speedSlider" min="50" max="150" value="100" step="5">
    </div>

    <div class="player-controls">
        <button id="btnPlay" class="btn-play" disabled>PLAY</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
    </div>

    <div id="stemsContainer" class="stems-container">
        <div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">
            Selecione uma música para carregar os canais.
        </div>
    </div>

    <div id="toastMessage" class="toast">Conectando à planilha...</div>

    <button id="btnClearCache" class="btn-clear-cache">🗑️ Limpar Áudios do Cache</button>
</div>

<script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCc-DraIfiV5aNPT81agJjZrFE8BSR0ocAcMbHRxSwEvJMBxlVXr4Vz6DBjxtzotG_M6amT7Myu79_/pub?output=csv';
    const CACHE_NAME = 'btk-audio-cache-v3';

    const trackSelect = document.getElementById('trackSelect');
    const timerDisplay = document.getElementById('timerDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const btnClearCache = document.getElementById('btnClearCache');
    const stemsContainer = document.getElementById('stemsContainer');
    const statusBadge = document.getElementById('status');
    const toastMessage = document.getElementById('toastMessage');

    let songsData = [];
    let audioElements = [];
    let objectUrls = [];
    let isPlaying = false;
    let syncInterval = null;
    let lastMasterTime = 0;

    function fixDropboxUrl(url) {
        if (!url) return '';
        url = url.trim();
        if (url.includes('dropbox.com')) {
            url = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
            if (url.includes('dl=0')) {
                url = url.replace('dl=0', 'raw=1');
            } else if (!url.includes('raw=1') && !url.includes('dl=1')) {
                url += (url.includes('?') ? '&' : '?') + 'raw=1';
            }
        }
        return url;
    }

    async function init() {
        await loadSongs();
    }

    async function loadSongs() {
        try {
            updateStatus('Buscando...', 'offline');
            const response = await fetch(GOOGLE_SHEET_CSV_URL);
            if (!response.ok) throw new Error('Falha de rede');
            
            const csvText = await response.text();
            songsData = parseCSV(csvText);

            localStorage.setItem('btk_songs_manifest', JSON.stringify(songsData));
            updateStatus('Online', 'online');
            toastMessage.textContent = 'Músicas atualizadas!';
            populateSelect(songsData);
        } catch (error) {
            const cached = localStorage.getItem('btk_songs_manifest');
            if (cached) {
                songsData = JSON.parse(cached);
                updateStatus('Modo Offline', 'offline');
                toastMessage.textContent = 'Modo Offline: Lista carregada do cache.';
                populateSelect(songsData);
            } else {
                updateStatus('Erro', 'offline');
                toastMessage.textContent = 'Erro ao conectar à planilha.';
            }
        }
    }

    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const parsed = [];

        for (let line of lines) {
            line = line.trim();
            if (!line) continue;

            let parts = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    parts.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            parts.push(current);

            if (parts.length >= 2) {
                const songName = parts[0].replace(/"/g, '').trim();
                if (!songName || songName.toLowerCase() === 'nome') continue;

                const urls = parts.slice(1)
                    .map(u => fixDropboxUrl(u.replace(/"/g, '')))
                    .filter(u => u.startsWith('http'));

                if (urls.length > 0) {
                    parsed.push({ name: songName, urls: urls });
                }
            }
        }
        return parsed;
    }

    function populateSelect(list) {
        trackSelect.innerHTML = '<option value="">-- Selecione uma música --</option>';
        list.forEach((song, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${song.name} (${song.urls.length} faixas)`;
            trackSelect.appendChild(opt);
        });
        trackSelect.disabled = false;
    }

    // Baixa o áudio e gera uma URL do Blob local no navegador para uso offline/cache
    async function getAudioBlobUrl(url) {
        const cache = await caches.open(CACHE_NAME);
        let response = await cache.match(url);

        if (!response) {
            toastMessage.textContent = 'Baixando áudio para o cache...';
            response = await fetch(url);
            if (response.ok) {
                cache.put(url, response.clone());
            }
        } else {
            toastMessage.textContent = 'Carregando do cache local...';
        }

        const blob = await response.blob();
        const objUrl = URL.createObjectURL(blob);
        objectUrls.push(objUrl);
        return objUrl;
    }

    function applyPitchPreservation(audio) {
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
        audio.mozPreservesPitch = true;
    }

    trackSelect.addEventListener('change', async (e) => {
        stopAll();
        clearCurrentAudioObjects();

        const index = e.target.value;

        if (index === '') {
            btnPlay.disabled = true;
            btnStop.disabled = true;
            stemsContainer.innerHTML = '<div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">Selecione uma música para carregar os canais.</div>';
            return;
        }

        const selectedSong = songsData[index];
        btnPlay.disabled = true;
        btnStop.disabled = true;
        stemsContainer.innerHTML = '';
        audioElements = [];

        try {
            for (let i = 0; i < selectedSong.urls.length; i++) {
                toastMessage.textContent = `Carregando faixa ${i + 1} de ${selectedSong.urls.length}...`;
                
                const blobUrl = await getAudioBlobUrl(selectedSong.urls[i]);
                const audio = new Audio(blobUrl);
                
                audio.loop = true;
                audio.preload = 'auto';
                applyPitchPreservation(audio);
                audio.playbackRate = speedSlider.value / 100;

                audioElements.push(audio);

                const row = document.createElement('div');
                row.className = 'stem-row';

                const title = document.createElement('span');
                title.className = 'stem-title';
                title.textContent = `Faixa ${i + 1}`;

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'btn-toggle on';
                toggleBtn.textContent = 'ON';

                toggleBtn.addEventListener('click', () => {
                    audio.muted = !audio.muted;
                    if (audio.muted) {
                        toggleBtn.textContent = 'OFF';
                        toggleBtn.className = 'btn-toggle off';
                    } else {
                        toggleBtn.textContent = 'ON';
                        toggleBtn.className = 'btn-toggle on';
                    }
                });

                row.appendChild(title);
                row.appendChild(toggleBtn);
                stemsContainer.appendChild(row);
            }

            btnPlay.disabled = false;
            btnStop.disabled = false;
            toastMessage.textContent = `Pronto! ${selectedSong.name} carregado.`;
        } catch (err) {
            console.error(err);
            toastMessage.textContent = 'Erro ao carregar arquivos de áudio.';
        }
    });

    function playAll() {
        if (audioElements.length === 0) return;

        const masterTime = audioElements[0].currentTime;

        audioElements.forEach(audio => {
            audio.currentTime = masterTime;
            audio.playbackRate = speedSlider.value / 100;
            applyPitchPreservation(audio);
            audio.play().catch(e => console.error(e));
        });

        isPlaying = true;
        btnPlay.textContent = 'PAUSE';
        startSyncAndTimer();
    }

    function pauseAll() {
        audioElements.forEach(audio => audio.pause());
        isPlaying = false;
        btnPlay.textContent = 'PLAY';
        stopSyncAndTimer();
    }

    function stopAll() {
        audioElements.forEach(audio => {
            audio.pause();
            audio.currentTime = 0;
        });
        isPlaying = false;
        btnPlay.textContent = 'PLAY';
        stopSyncAndTimer();
        timerDisplay.textContent = '00:00.0';
    }

    btnPlay.addEventListener('click', () => {
        if (!isPlaying) {
            playAll();
        } else {
            pauseAll();
        }
    });

    btnStop.addEventListener('click', () => {
        stopAll();
    });

    speedSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        speedDisplay.textContent = `${val}%`;
        const rate = val / 100;

        audioElements.forEach(audio => {
            audio.playbackRate = rate;
            applyPitchPreservation(audio);
        });
    });

    function startSyncAndTimer() {
        stopSyncAndTimer();
        syncInterval = setInterval(() => {
            if (!isPlaying || audioElements.length === 0) return;

            const master = audioElements[0];

            // Trata o reinício do Loop contínuo
            if (master.currentTime < lastMasterTime - 0.5) {
                audioElements.forEach(a => a.currentTime = master.currentTime);
            }
            lastMasterTime = master.currentTime;

            // Corrige desvios de micro-segundos entre as faixas e o mestre
            for (let i = 1; i < audioElements.length; i++) {
                const diff = Math.abs(audioElements[i].currentTime - master.currentTime);
                if (diff > 0.03) {
                    audioElements[i].currentTime = master.currentTime;
                }
            }

            // Atualiza o tempo na tela
            const current = master.currentTime;
            const mins = Math.floor(current / 60).toString().padStart(2, '0');
            const secs = Math.floor(current % 60).toString().padStart(2, '0');
            const ms = Math.floor((current % 1) * 10);
            timerDisplay.textContent = `${mins}:${secs}.${ms}`;
        }, 100);
    }

    function stopSyncAndTimer() {
        if (syncInterval) clearInterval(syncInterval);
    }

    function clearCurrentAudioObjects() {
        objectUrls.forEach(url => URL.revokeObjectURL(url));
        objectUrls = [];
    }

    btnClearCache.addEventListener('click', async () => {
        stopAll();
        clearCurrentAudioObjects();
        const deleted = await caches.delete(CACHE_NAME);
        localStorage.removeItem('btk_songs_manifest');
        if (deleted) {
            toastMessage.textContent = 'Cache de áudio limpo com sucesso!';
        } else {
            toastMessage.textContent = 'Nenhum cache localizado.';
        }
    });

    function updateStatus(text, type) {
        statusBadge.textContent = text;
        statusBadge.className = `status-badge ${type}`;
    }

    init();
</script>
</body>
</html>
