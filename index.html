<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Multitrack (Loop Infinito)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .multitrack-container {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h2 {
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .master-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 12px;
        }

        .master-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-master {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-play {
            background: #28a745;
            color: #ffffff;
        }
        .btn-play:hover:not(:disabled) {
            background: #218838;
        }
        .btn-play:disabled {
            background: #444444;
            color: #888888;
            cursor: not-allowed;
        }

        .btn-stop {
            background: #dc3545;
            color: #ffffff;
        }
        .btn-stop:hover {
            background: #c82333;
        }

        .btn-cache {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .btn-cache:hover {
            background: rgba(220, 53, 69, 0.2);
            border-color: #dc3545;
            color: #fff;
        }

        .status-box {
            font-size: 0.85em;
            color: #00bcd4;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 188, 212, 0.1);
            border-radius: 6px;
            border-left: 4px solid #00bcd4;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-row {
            display: grid;
            grid-template-columns: 140px 100px 1fr;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-name {
            font-weight: 600;
            font-size: 0.9em;
            color: #ffeb3b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-mute {
            padding: 8px 12px;
            border: 1px solid #28a745;
            background: rgba(40, 167, 69, 0.15);
            color: #28a745;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-mute.is-muted {
            background: rgba(220, 53, 69, 0.85);
            border-color: #dc3545;
            color: #ffffff;
        }

        input[type=range] {
            width: 100%;
            accent-color: #00bcd4;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="multitrack-container">
        <h2>🎛️ Player Multitrack (Loop)</h2>

        <div class="master-controls">
            <div class="master-buttons">
                <button id="btn-play-master" class="btn-master btn-play" onclick="togglePlay()" disabled>Carregando...</button>
                <button class="btn-master btn-stop" onclick="stopAll()">■ Stop</button>
            </div>
            <button class="btn-cache" onclick="limparCache()">🗑️ Limpar Memória Local</button>
        </div>

        <div class="status-box" id="status-text">Iniciando sistema...</div>

        <div class="track-list" id="track-container"></div>
    </div>

    <script>
        const CACHE_NAME = 'multitrack-audio-v1';

        const AUDIO_URLS = [
            { name: "01. Caixa",  url: "https://www.dropbox.com/scl/fi/sua_caixa.wav?dl=0" },
            { name: "02. Tom 1",  url: "https://www.dropbox.com/scl/fi/seu_tom1.wav?dl=0" },
            { name: "03. Tom 2",  url: "https://www.dropbox.com/scl/fi/seu_tom2.wav?dl=0" },
            { name: "04. Bumbo",  url: "https://www.dropbox.com/scl/fi/seu_bumbo.wav?dl=0" },
            { name: "05. Prato",  url: "https://www.dropbox.com/scl/fi/seu_prato.wav?dl=0" }
        ];

        let audioCtx;
        let audioBuffers = [];
        let sourceNodes = [];
        let gainNodes = [];
        let muteStates = new Array(AUDIO_URLS.length).fill(false);

        let isPlaying = false;
        let isLoaded = false;
        let startTime = 0;
        let pauseOffset = 0;

        function normalizarUrl(url) {
            if (!url) return '';
            let link = url.trim();
            if (link.includes('dropbox.com')) {
                return link.replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                           .replace('?dl=0', '')
                           .replace('&dl=0', '');
            } else if (link.includes('drive.google.com') && link.includes('/d/')) {
                const id = link.split('/d/')[1].split('/')[0];
                return `https://drive.google.com/uc?export=download&id=${id}`;
            }
            return link;
        }

        function renderTracks() {
            const container = document.getElementById('track-container');
            container.innerHTML = '';

            AUDIO_URLS.forEach((track, index) => {
                container.innerHTML += `
                    <div class="track-row">
                        <span class="track-name" title="${track.name}">${track.name}</span>
                        <button class="btn-mute" id="mute-btn-${index}" onclick="toggleTrackMute(${index})">
                            🔊 LIGADO
                        </button>
                        <input type="range" id="vol-${index}" min="0" max="1" step="0.01" value="1" oninput="changeVolume(${index}, this.value)">
                    </div>
                `;
            });
        }

        async function loadAllTracksWithCache() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const statusText = document.getElementById('status-text');

            try {
                const cache = await caches.open(CACHE_NAME);

                const promises = AUDIO_URLS.map(async (item, index) => {
                    const finalUrl = normalizarUrl(item.url);
                    statusText.innerText = `Verificando cache da faixa ${index + 1} de ${AUDIO_URLS.length}...`;

                    let response = await cache.match(finalUrl);

                    if (!response) {
                        statusText.innerText = `Baixando da nuvem (${index + 1}/${AUDIO_URLS.length}): ${item.name}...`;
                        const req = new Request(finalUrl, { mode: 'cors' });
                        response = await fetch(req);
                        
                        if (!response.ok) throw new Error(`Não foi possível baixar: ${item.name}`);
                        await cache.put(req, response.clone());
                    }

                    const arrayBuffer = await response.arrayBuffer();
                    return await audioCtx.decodeAudioData(arrayBuffer);
                });

                audioBuffers = await Promise.all(promises);
                isLoaded = true;

                statusText.innerText = "✅ Áudios prontos na memória! Pressione PLAY para iniciar o Loop.";
                const btnPlay = document.getElementById('btn-play-master');
                btnPlay.innerText = "▶ PLAY";
                btnPlay.disabled = false;

            } catch (err) {
                console.error("Erro ao carregar faixas:", err);
                statusText.innerText = "⚠️ Erro ao carregar arquivos de áudio. Verifique os links ou conexões CORS.";
            }
        }

        function togglePlay() {
            if (!isLoaded) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                pauseAll();
            } else {
                playAll();
            }
        }

        function playAll() {
            sourceNodes = [];
            gainNodes = [];
            const now = audioCtx.currentTime;

            audioBuffers.forEach((buffer, index) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                // 🔁 ATIVA O LOOP INFINITO
                source.loop = true;

                const gain = audioCtx.createGain();
                const volSlider = document.getElementById(`vol-${index}`).value;
                
                gain.gain.value = muteStates[index] ? 0 : volSlider;

                source.connect(gain);
                gain.connect(audioCtx.destination);

                source.start(now, pauseOffset % buffer.duration);

                sourceNodes.push(source);
                gainNodes.push(gain);
            });

            startTime = audioCtx.currentTime - pauseOffset;
            isPlaying = true;
            document.getElementById('btn-play-master').innerText = "⏸ PAUSE";
            document.getElementById('status-text').innerText = "🔁 Reproduzindo em Loop Infinito sem paradas!";
        }

        function pauseAll() {
            if (!isPlaying) return;
            pauseOffset = audioCtx.currentTime - startTime;
            sourceNodes.forEach(source => source.stop());
            isPlaying = false;
            document.getElementById('btn-play-master').innerText = "▶ PLAY";
            document.getElementById('status-text').innerText = "⏸ Loop Pausado.";
        }

        function stopAll() {
            if (sourceNodes.length > 0) {
                sourceNodes.forEach(source => {
                    try { source.stop(); } catch(e){}
                });
            }
            isPlaying = false;
            pauseOffset = 0;
            document.getElementById('btn-play-master').innerText = "▶ PLAY";
            document.getElementById('status-text').innerText = "⏹ Loop Parado.";
        }

        function changeVolume(index, value) {
            if (gainNodes[index] && !muteStates[index]) {
                gainNodes[index].gain.value = value;
            }
        }

        function toggleTrackMute(index) {
            muteStates[index] = !muteStates[index];
            const btn = document.getElementById(`mute-btn-${index}`);
            const sliderVal = document.getElementById(`vol-${index}`).value;

            if (muteStates[index]) {
                btn.classList.add('is-muted');
                btn.innerText = "🔇 MUTE";
                if (gainNodes[index]) gainNodes[index].gain.value = 0;
            } else {
                btn.classList.remove('is-muted');
                btn.innerText = "🔊 LIGADO";
                if (gainNodes[index]) gainNodes[index].gain.value = sliderVal;
            }
        }

        async function limparCache() {
            if (confirm("Deseja apagar os áudios salvos no dispositivo local?")) {
                await caches.delete(CACHE_NAME);
                alert("Memória limpa com sucesso!");
                location.reload();
            }
        }

        window.addEventListener('load', () => {
            renderTracks();
            loadAllTracksWithCache();
        });
    </script>
</body>
</html>
