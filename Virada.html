<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTK - Multi-Track Studio</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff9800;
            --fill-color: #e91e63;
            --ending-color: #9c27b0;
            --text-color: #ffffff;
            --subtext-color: #b0b0b0;
            --error-color: #f44336;
            --success-color: #4caf50;
            --btn-off: #424242;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        @media (max-width: 500px) {
            body { padding: 0; }
            .container {
                max-width: 100%;
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
                justify-content: space-between;
            }
        }

        .license-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            z-index: 200;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 24px; text-align: center; gap: 16px;
        }
        .license-overlay.hidden { display: none; }

        .license-input {
            width: 100%; padding: 16px; font-size: 1.1rem;
            text-align: center; letter-spacing: 2px;
            background: #2a2a2a; color: var(--text-color);
            border: 2px solid #444; border-radius: 12px;
            outline: none; text-transform: uppercase;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .header h2 { margin: 0; font-size: 1.2rem; }

        .status-badge {
            font-size: 0.75rem; padding: 4px 8px;
            border-radius: 12px; background: #333;
            color: var(--subtext-color);
        }
        .status-badge.online { background: rgba(76, 175, 80, 0.2); color: var(--success-color); }
        .status-badge.offline { background: rgba(244, 67, 54, 0.2); color: var(--error-color); }

        select {
            width: 100%; padding: 14px; font-size: 0.95rem;
            background: #2a2a2a; color: var(--text-color);
            border: 2px solid #444; border-radius: 12px;
            outline: none; cursor: pointer;
        }

        .timer-box {
            text-align: center; background: #181818;
            padding: 14px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            position: relative;
        }

        .circle-container {
            position: relative;
            width: 140px; height: 140px;
            display: flex; justify-content: center; align-items: center;
        }

        .circle-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .circle-bg { fill: none; stroke: #2a2a2a; stroke-width: 10; }
        .circle-progress {
            fill: none; stroke: var(--accent-color); stroke-width: 10;
            stroke-dasharray: 440; stroke-dashoffset: 440;
            stroke-linecap: round; transition: stroke-dashoffset 0.08s linear, stroke 0.3s;
        }
        .circle-progress.playing-fill { stroke: var(--fill-color); }
        .circle-progress.playing-ending { stroke: var(--ending-color); }

        .timer-inner-content { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .timer-label { font-size: 0.7rem; color: var(--subtext-color); }
        .timer-display { font-size: 1.7rem; font-weight: bold; font-family: monospace; color: var(--text-color); }

        .speed-control { display: flex; flex-direction: column; gap: 6px; }
        .speed-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold; }

        input[type="range"] {
            width: 100%; height: 14px; border-radius: 8px;
            accent-color: var(--accent-color); cursor: pointer;
        }

        .player-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        button {
            padding: 14px; font-size: 0.95rem; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-play { background: var(--accent-color); color: #000; }
        .btn-stop { background: #333; color: var(--text-color); }
        .btn-stop.armed { background: var(--ending-color); color: #fff; }
        
        .btn-fill {
            background: var(--fill-color); color: #fff;
            grid-column: span 2; font-size: 1rem;
        }
        .btn-fill.armed { animation: pulse 0.8s infinite alternate; background: #ff5252; }

        .btn-clear-cache {
            background: transparent; color: var(--subtext-color);
            border: 1px solid #444; padding: 10px 12px;
            font-size: 0.8rem; border-radius: 8px; margin-top: 5px;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.7; transform: scale(0.99); }
        }

        .stems-container {
            display: flex; flex-direction: column; gap: 8px;
            background: #181818; padding: 10px; border-radius: 12px;
            max-height: 200px; overflow-y: auto;
        }

        .stem-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 8px 12px; border-radius: 8px;
        }

        .btn-toggle { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; min-width: 60px; }
        .btn-toggle.on { background: var(--success-color); color: #fff; }
        .btn-toggle.off { background: var(--btn-off); color: var(--subtext-color); }

        .toast { font-size: 0.8rem; text-align: center; color: var(--subtext-color); min-height: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div id="licenseOverlay" class="license-overlay">
        <h2>🔑 Ativação BTK</h2>
        <p style="color: var(--subtext-color); font-size: 0.85rem; margin: 0;">Insira sua chave de licença para liberar o aplicativo.</p>
        <input type="text" id="licenseKeyInput" class="license-input" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
        <button id="btnActivate" style="width:100%; background:var(--accent-color); color:#000; font-weight:bold;">ATIVAR LICENÇA</button>
        <div id="licenseMessage" style="color: var(--error-color); font-size: 0.85rem; min-height: 18px;"></div>
    </div>

    <div class="header">
        <h2>🥁 BTK Studio</h2>
        <span id="status" class="status-badge">Detectando...</span>
    </div>

    <div>
        <select id="trackSelect" disabled>
            <option>Carregando lista...</option>
        </select>
    </div>

    <div class="timer-box">
        <div class="circle-container">
            <svg class="circle-svg" viewBox="0 0 160 160">
                <circle class="circle-bg" cx="80" cy="80" r="70"></circle>
                <circle id="circleProgress" class="circle-progress" cx="80" cy="80" r="70"></circle>
            </svg>
            <div class="timer-inner-content">
                <div id="timerLabel" class="timer-label"> ⏱️ </div>
                <div id="timerDisplay" class="timer-display">00:00.0</div>
            </div>
        </div>
    </div>

    <div class="speed-control">
        <div class="speed-header">
            <span>Velocidade</span>
            <span id="speedDisplay">100%</span>
        </div>
        <input type="range" id="speedSlider" min="70" max="130" value="100" step="5">
    </div>

    <div class="player-controls">
        <button id="btnPlay" class="btn-play" disabled>PLAY</button>
        <button id="btnStop" class="btn-stop" disabled>STOP</button>
        <button id="btnFill" class="btn-fill" disabled>🪘 VIRADA</button>
    </div>

    <div id="stemsContainer" class="stems-container">
        <div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">
            Selecione um ritmo / música para carregar os canais/instrumentos.
        </div>
    </div>

    <div id="toastMessage" class="toast">Aguardando ativação...</div>
    <button id="btnClearCache" class="btn-clear-cache">🗑️ Limpar Áudio Selecionado do Cache </button>
</div>

<script>
    const VALID_LICENSES = ['BTK-2026-VIP', 'PERCUSSAO-100', 'SHOW-BTK-88'];
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyGsTdTZ_GsErA4ftNxER72bFlvv2axUGqB-npctmPVLJBalT9G4436-5QWErSRAeyr/exec';
    const CACHE_NAME = 'btk-audio-cache-v18';

    const licenseOverlay = document.getElementById('licenseOverlay');
    const licenseKeyInput = document.getElementById('licenseKeyInput');
    const trackSelect = document.getElementById('trackSelect');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerLabel = document.getElementById('timerLabel');
    const circleProgress = document.getElementById('circleProgress');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const btnPlay = document.getElementById('btnPlay');
    const btnStop = document.getElementById('btnStop');
    const btnFill = document.getElementById('btnFill');
    const btnClearCache = document.getElementById('btnClearCache');
    const stemsContainer = document.getElementById('stemsContainer');
    const statusBadge = document.getElementById('status');
    const toastMessage = document.getElementById('toastMessage');

    let songsData = [];
    let audioElements = [];
    let fillAudioElements = [];
    let endingAudioElements = [];
    let objectUrls = [];

    let isPlaying = false;
    let isFillArmed = false;
    let isFillPlaying = false;
    let isEndingArmed = false;
    let isEndingPlaying = false;
    let syncInterval = null;
    let lastMasterTime = 0;
    let currentOriginalBpm = null;

    const CIRCLE_CIRCUMFERENCE = 440;

    function checkLicense() {
        const savedKey = localStorage.getItem('btk_license_key');
        if (savedKey && VALID_LICENSES.includes(savedKey.trim().toUpperCase())) {
            licenseOverlay.classList.add('hidden');
            initApp();
        } else {
            licenseOverlay.classList.remove('hidden');
        }
    }

    document.getElementById('btnActivate').addEventListener('click', () => {
        const inputKey = licenseKeyInput.value.trim().toUpperCase();
        if (VALID_LICENSES.includes(inputKey)) {
            localStorage.setItem('btk_license_key', inputKey);
            licenseOverlay.classList.add('hidden');
            initApp();
        } else {
            document.getElementById('licenseMessage').textContent = 'Chave inválida.';
        }
    });

    async function initApp() {
        await loadSongs();
    }

    async function loadSongs() {
        try {
            updateStatus('Buscando...', 'offline');
            const response = await fetch(WEB_APP_URL);
            if (!response.ok) throw new Error('Falha de rede');
            
            songsData = await response.json();

            localStorage.setItem('btk_songs_manifest', JSON.stringify(songsData));
            updateStatus('Online', 'online');
            toastMessage.textContent = 'Músicas carregadas!';
            await populateSelect(songsData);
        } catch (error) {
            const cached = localStorage.getItem('btk_songs_manifest');
            if (cached) {
                songsData = JSON.parse(cached);
                updateStatus('Modo Offline', 'offline');
                toastMessage.textContent = 'Modo Offline: Lista em cache.';
                await populateSelect(songsData);
            } else {
                updateStatus('Erro', 'offline');
                toastMessage.textContent = 'Erro de conexão com o servidor.';
            }
        }
    }

    async function populateSelect(list) {
        trackSelect.innerHTML = '<option value="">-- Selecione uma música --</option>';
        list.forEach((song, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            const hasFill = song.fillTracks && song.fillTracks.length > 0 ? ' [🪘 Virada]' : '';
            const hasFim = song.endingTracks && song.endingTracks.length > 0 ? ' [🏁 Fim]' : '';
            opt.textContent = `🎵 ${song.name} (${song.tracks.length} faixas)${hasFill}${hasFim}`;
            trackSelect.appendChild(opt);
        });
        trackSelect.disabled = false;
        await updateSelectCacheIndicators();
    }

    async function updateSelectCacheIndicators() {
        try {
            const cache = await caches.open(CACHE_NAME);
            for (let i = 0; i < songsData.length; i++) {
                const song = songsData[i];
                let allCached = true;

                const allTrackUrls = [
                    ...song.tracks,
                    ...(song.fillTracks || []),
                    ...(song.endingTracks || [])
                ];

                for (const track of allTrackUrls) {
                    const match = await cache.match(track.url);
                    if (!match) { allCached = false; break; }
                }

                const option = trackSelect.options[i + 1];
                if (option) {
                    const hasFill = song.fillTracks && song.fillTracks.length > 0 ? ' [🪘 Virada]' : '';
                    const hasFim = song.endingTracks && song.endingTracks.length > 0 ? ' [🏁 Fim]' : '';
                    option.textContent = allCached 
                        ? `✅ ${song.name} (${song.tracks.length} faixas)${hasFill}${hasFim}`
                        : `🎵 ${song.name} (${song.tracks.length} faixas)${hasFill}${hasFim}`;
                }
            }
        } catch (e){}
    }

    async function getAudioBlobUrl(url) {
        try {
            const cache = await caches.open(CACHE_NAME);
            let response = await cache.match(url);

            if (!response) {
                toastMessage.textContent = 'Baixando áudio para o cache local...';
                response = await fetch(url);
                if (response.ok) cache.put(url, response.clone());
            }

            const blob = await response.blob();
            const objUrl = URL.createObjectURL(blob);
            objectUrls.push(objUrl);
            return objUrl;
        } catch (err) {
            return url;
        }
    }

    function waitForAudioReady(audio) {
        return new Promise((resolve) => {
            if (audio.readyState >= 3) resolve();
            else {
                audio.addEventListener('canplaythrough', resolve, { once: true });
                setTimeout(resolve, 3500);
            }
        });
    }

    function applyPitchPreservation(audio) {
        audio.preservesPitch = true;
        audio.webkitPreservesPitch = true;
        audio.mozPreservesPitch = true;
    }

    function updateSpeedDisplay() {
        const percent = parseInt(speedSlider.value);
        if (currentOriginalBpm) {
            const calculatedBpm = Math.round(currentOriginalBpm * (percent / 100));
            speedDisplay.textContent = `${calculatedBpm} BPM (${percent}%)`;
        } else {
            speedDisplay.textContent = `${percent}%`;
        }
    }

    trackSelect.addEventListener('change', async (e) => {
        stopAll();
        clearCurrentAudioObjects();

        const index = e.target.value;
        if (index === '') {
            btnPlay.disabled = true; btnStop.disabled = true; btnFill.disabled = true;
            stemsContainer.innerHTML = '<div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">Selecione uma música para carregar os canais.</div>';
            return;
        }

        const selectedSong = songsData[index];
        currentOriginalBpm = selectedSong.originalBpm;
        updateSpeedDisplay();

        btnPlay.disabled = true; btnStop.disabled = true; btnFill.disabled = true;
        stemsContainer.innerHTML = '';
        audioElements = []; fillAudioElements = []; endingAudioElements = [];

        try {
            // Filtra e exibe APENAS os loops principais (oculta viradas e fins da lista visual)
            for (let i = 0; i < selectedSong.tracks.length; i++) {
                const track = selectedSong.tracks[i];
                
                // Pula a criação de botão visual se for uma track de virada/fim
                const lowerName = track.name.toLowerCase();
                if (lowerName.includes('_vira') || lowerName.includes('_fill') || lowerName.includes('_fim') || lowerName.includes('_final')) {
                    continue;
                }

                toastMessage.textContent = `Carregando ${track.name} (${i + 1}/${selectedSong.tracks.length})...`;
                
                const audioSource = await getAudioBlobUrl(track.url);
                const audio = new Audio(audioSource);
                audio.loop = true; audio.preload = 'auto'; audio.volume = 1;

                applyPitchPreservation(audio);
                await waitForAudioReady(audio);
                audioElements.push(audio);

                const row = document.createElement('div');
                row.className = 'stem-row';

                const title = document.createElement('span');
                title.className = 'stem-title';
                title.textContent = track.name;

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'btn-toggle on';
                toggleBtn.textContent = 'ON';

                toggleBtn.addEventListener('click', () => {
                    if (audio.volume > 0) {
                        audio.volume = 0; toggleBtn.textContent = 'OFF'; toggleBtn.className = 'btn-toggle off';
                    } else {
                        audio.volume = 1; toggleBtn.textContent = 'ON'; toggleBtn.className = 'btn-toggle on';
                    }
                });

                row.appendChild(title); row.appendChild(toggleBtn);
                stemsContainer.appendChild(row);
            }

            // Carrega viradas em segundo plano (sem criar linhas na tela)
            if (selectedSong.fillTracks && selectedSong.fillTracks.length > 0) {
                for (let f = 0; f < selectedSong.fillTracks.length; f++) {
                    const fillSource = await getAudioBlobUrl(selectedSong.fillTracks[f].url);
                    const fillAudio = new Audio(fillSource);
                    fillAudio.loop = false; fillAudio.preload = 'auto';
                    applyPitchPreservation(fillAudio);
                    await waitForAudioReady(fillAudio);
                    fillAudioElements.push(fillAudio);
                }
                btnFill.disabled = false;
            } else {
                btnFill.disabled = true;
            }

            // Carrega finalizações em segundo plano (sem criar linhas na tela)
            if (selectedSong.endingTracks && selectedSong.endingTracks.length > 0) {
                for (let e = 0; e < selectedSong.endingTracks.length; e++) {
                    const endSource = await getAudioBlobUrl(selectedSong.endingTracks[e].url);
                    const endAudio = new Audio(endSource);
                    endAudio.loop = false; endAudio.preload = 'auto';
                    applyPitchPreservation(endAudio);
                    await waitForAudioReady(endAudio);
                    endingAudioElements.push(endAudio);
                }
            }

            btnPlay.disabled = false; btnStop.disabled = false;
            toastMessage.textContent = `Pronto! ${selectedSong.name} carregado.`;
            await updateSelectCacheIndicators();

        } catch (err) {
            toastMessage.textContent = 'Erro ao carregar canais.';
        }
    });

    btnFill.addEventListener('click', () => {
        if (!isPlaying || fillAudioElements.length === 0) return;
        if (!isFillArmed) {
            isFillArmed = true; btnFill.classList.add('armed');
            circleProgress.classList.add('armed-fill');
            btnFill.textContent = '⏳ VIRADA AGENDADA...';
        } else {
            isFillArmed = false; btnFill.classList.remove('armed');
            circleProgress.classList.remove('armed-fill');
            btnFill.textContent = '🪘 VIRADA / FILL';
        }
    });

    btnStop.addEventListener('click', () => {
        if (isPlaying && endingAudioElements.length > 0 && !isEndingArmed) {
            isEndingArmed = true; btnStop.classList.add('armed');
            circleProgress.classList.add('armed-ending');
            btnStop.textContent = '⏳ FINALIZANDO...';
        } else {
            stopAll();
        }
    });

    function playAll() {
        if (audioElements.length === 0) return;
        const masterTime = audioElements[0].currentTime;

        audioElements.forEach(audio => {
            audio.currentTime = masterTime;
            audio.playbackRate = speedSlider.value / 100;
            applyPitchPreservation(audio);
            audio.play().catch(e => console.error(e));
        });

        isPlaying = true; btnPlay.textContent = 'PAUSE';
        startSyncAndTimer();
    }

    function stopAll() {
        audioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });
        fillAudioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });
        endingAudioElements.forEach(audio => { audio.pause(); audio.currentTime = 0; });

        isPlaying = false; isFillArmed = false; isFillPlaying = false;
        isEndingArmed = false; isEndingPlaying = false;

        btnFill.classList.remove('armed'); btnFill.textContent = '🪘 VIRADA / FILL';
        btnStop.classList.remove('armed'); btnStop.textContent = 'STOP';
        
        circleProgress.className = 'circle-progress';
        circleProgress.style.strokeDashoffset = CIRCLE_CIRCUMFERENCE;

        timerLabel.textContent = 'TEMPO / LOOP';
        btnPlay.textContent = 'PLAY';
        stopSyncAndTimer();
        timerDisplay.textContent = '00:00.0'; lastMasterTime = 0;
    }

    btnPlay.addEventListener('click', () => { if (!isPlaying) playAll(); else pauseAll(); });

    speedSlider.addEventListener('input', (e) => {
        updateSpeedDisplay();
        const rate = parseInt(e.target.value) / 100;
        audioElements.forEach(audio => { audio.playbackRate = rate; applyPitchPreservation(audio); });
        fillAudioElements.forEach(audio => { audio.playbackRate = rate; applyPitchPreservation(audio); });
        endingAudioElements.forEach(audio => { audio.playbackRate = rate; applyPitchPreservation(audio); });
    });

    function startSyncAndTimer() {
        stopSyncAndTimer();
        syncInterval = setInterval(() => {
            if (!isPlaying) return;

            let master = null;

            if (isEndingPlaying && endingAudioElements.length > 0) {
                master = endingAudioElements[0]; timerLabel.textContent = '🏁 FINALIZANDO';
            } else if (isFillPlaying && fillAudioElements.length > 0) {
                master = fillAudioElements[0]; timerLabel.textContent = '🔥 VIRADA';
            } else if (audioElements.length > 0) {
                master = audioElements[0]; timerLabel.textContent = 'TEMPO / LOOP';
            }

            if (!master) return;

            if (master.duration && !isNaN(master.duration)) {
                const percent = master.currentTime / master.duration;
                const offset = CIRCLE_CIRCUMFERENCE - (percent * CIRCLE_CIRCUMFERENCE);
                circleProgress.style.strokeDashoffset = offset;
            }

            if (!isFillPlaying && !isEndingPlaying) {
                if (master.currentTime < lastMasterTime - 0.5) {
                    if (isEndingArmed) {
                        dispararFinalizacao();
                    } else if (isFillArmed) {
                        dispararVirada();
                    } else {
                        audioElements.forEach(a => a.currentTime = master.currentTime);
                    }
                }
                lastMasterTime = master.currentTime;
            }

            const current = master.currentTime;
            const mins = Math.floor(current / 60).toString().padStart(2, '0');
            const secs = Math.floor(current % 60).toString().padStart(2, '0');
            const ms = Math.floor((current % 1) * 10);
            timerDisplay.textContent = `${mins}:${secs}.${ms}`;
        }, 60);
    }

    function dispararVirada() {
        isFillArmed = false; isFillPlaying = true;
        btnFill.classList.remove('armed'); 
        circleProgress.classList.remove('armed-fill');
        circleProgress.classList.add('playing-fill');
        btnFill.textContent = '🔥 TOCANDO VIRADA...';

        audioElements.forEach(a => a.pause());

        fillAudioElements.forEach(fill => {
            fill.currentTime = 0;
            fill.playbackRate = speedSlider.value / 100;
            applyPitchPreservation(fill);
            fill.play().catch(e => console.error(e));
        });

        const masterFill = fillAudioElements[0];
        const onFillEnd = () => {
            isFillPlaying = false;
            circleProgress.classList.remove('playing-fill');
            btnFill.textContent = '🪘 VIRADA / FILL';
            audioElements.forEach(a => { a.currentTime = 0; a.play().catch(e => console.error(e)); });
            masterFill.removeEventListener('ended', onFillEnd);
        };
        masterFill.addEventListener('ended', onFillEnd);
    }

    function dispararFinalizacao() {
        isEndingArmed = false; isEndingPlaying = true;
        btnStop.classList.remove('armed');
        circleProgress.classList.remove('armed-ending');
        circleProgress.classList.add('playing-ending');

        audioElements.forEach(a => a.pause());

        endingAudioElements.forEach(end => {
            end.currentTime = 0;
            end.playbackRate = speedSlider.value / 100;
            applyPitchPreservation(end);
            end.play().catch(e => console.error(e));
        });

        const masterEnding = endingAudioElements[0];
        const onEndingEnd = () => {
            stopAll();
            masterEnding.removeEventListener('ended', onEndingEnd);
        };
        masterEnding.addEventListener('ended', onEndingEnd);
    }

    function stopSyncAndTimer() { if (syncInterval) clearInterval(syncInterval); }
    function clearCurrentAudioObjects() { objectUrls.forEach(url => URL.revokeObjectURL(url)); objectUrls = []; }

    // LIMPEZA SELETIVA DE CACHE
    btnClearCache.addEventListener('click', async () => {
        const selectedIndex = trackSelect.value;
        if (selectedIndex === '') { toastMessage.textContent = 'Selecione uma música para limpar o cache.'; return; }

        stopAll(); clearCurrentAudioObjects();
        const selectedSong = songsData[selectedIndex];
        
        try {
            const cache = await caches.open(CACHE_NAME);
            let removedCount = 0;
            const allTrackUrls = [
                ...selectedSong.tracks,
                ...(selectedSong.fillTracks || []),
                ...(selectedSong.endingTracks || [])
            ];

            for (const track of allTrackUrls) {
                if (await cache.delete(track.url)) removedCount++;
            }

            audioElements = []; fillAudioElements = []; endingAudioElements = [];
            stemsContainer.innerHTML = '<div style="text-align: center; color: var(--subtext-color); font-size: 0.85rem;">Selecione uma música para carregar os canais.</div>';
            btnPlay.disabled = true; btnStop.disabled = true; btnFill.disabled = true;
            trackSelect.value = '';

            await updateSelectCacheIndicators();
            toastMessage.textContent = `Cache de "${selectedSong.name}" limpo com sucesso! (${removedCount} arquivos removidos)`;
        } catch (e){
            toastMessage.textContent = 'Erro ao tentar limpar o cache.';
        }
    });

    function updateStatus(text, type) {
        statusBadge.textContent = text;
        statusBadge.className = `status-badge ${type}`;
    }

    document.addEventListener('keydown', (e) => {
        if (document.activeElement === licenseKeyInput) return;
        if (document.activeElement === trackSelect) trackSelect.blur();

        const key = e.key.toLowerCase();

        if ([' ', 'pagedown', 'pageup', 'arrowup', 'arrowdown'].includes(key)) {
            e.preventDefault();
        }

        switch (key) {
            case ' ':
            case 'pagedown':
            case 'enter': 
                if (!btnPlay.disabled) btnPlay.click(); 
                break;
            case 'pageup':
            case 'escape': 
                if (!btnStop.disabled) btnStop.click(); 
                break;
            case 'v': 
                if (!btnFill.disabled) btnFill.click(); 
                break;
        }
    });

    checkLicense();
</script>
</body>
</html>
